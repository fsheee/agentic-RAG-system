name: Deploy

# Runs on main only: test the push, then publish BOTH Vercel projects.
# Pull requests and feature branches are covered by ci.yml, so the suite
# does not run twice per merge.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN  — Vercel token with access to the team below
#   VERCEL_ORG_ID — team_OuVuWFb4CX4GlaWa2YbnNyAC
#
# Project ids are not credentials, so they are inlined in each deploy job:
#   backend   prj_XoGPPcXH1nFTEUgMI5uXzUf0l4Rc
#             (agentic-rag-with-gemini-embedding-model)
#   frontend  prj_r8m4yQg5A7HKqjcrcEyZlQ4oNCiT
#             (agentic-ragsystem)
#
# Required Vercel runtime settings (Production environment) live in the
# dashboard, not here:
#   backend:  PYTHONPATH=backend, DATABASE_URL, JWT_SECRET, GOOGLE_API_KEY,
#             EMBEDDING_MODEL, QDRANT_URL, QDRANT_API_KEY, ALLOWED_ORIGINS
#   frontend: NEXT_PUBLIC_API_URL
# Schema and vectors are NOT created by this workflow: run
# `python -m app.seed` and `python -m app.ingest` against production once.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # auth.py raises at import time when JWT_SECRET is missing. The suite
      # runs without a .env and mocks every external service, so this
      # throwaway value is all it needs.
      JWT_SECRET: ci-only-not-a-real-secret-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run python -m pytest -q -m "not integration"

  deploy-backend:
    name: Deploy backend (FastAPI)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_XoGPPcXH1nFTEUgMI5uXzUf0l4Rc
      # Helps `vercel build` resolve the `app.*` imports while analysing the
      # entrypoint. This does not reach the running function — the same value
      # must also be set in the Vercel project's Production environment.
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # `vercel build` runs Vercel's Python builder on this runner, and that
      # builder shells out to `uv`. Having uv on PATH is not enough: it also
      # looks in /usr/bin and /usr/local/bin, so install it there too.
      - name: Set up uv for the Vercel builder
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version-file: .python-version
          enable-cache: true

      - name: Expose uv to the Vercel builder
        run: |
          sudo install -m 0755 "$(command -v uv)" /usr/bin/uv
          sudo install -m 0755 "$(command -v uv)" /usr/local/bin/uv
          uv --version

      # Fails here, with a readable message, if the token or org id is wrong
      # — instead of an opaque failure inside `vercel pull`.
      - name: Verify Vercel credentials
        run: |
          vercel whoami --token="${{ secrets.VERCEL_TOKEN }}"
          echo "org=$VERCEL_ORG_ID project=$VERCEL_PROJECT_ID"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Backend: $url" >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: Deploy frontend (Next.js)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_r8m4yQg5A7HKqjcrcEyZlQ4oNCiT
      NEXT_TELEMETRY_DISABLED: "1"
      # Inlined into the client bundle. Set a repository variable to point a
      # preview/other environment elsewhere; defaults to the deployed backend.
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://agentic-rag-with-gemini-embedding-m.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify Vercel credentials
        run: |
          vercel whoami --token="${{ secrets.VERCEL_TOKEN }}"
          echo "org=$VERCEL_ORG_ID project=$VERCEL_PROJECT_ID"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Frontend: $url" >> "$GITHUB_STEP_SUMMARY"
