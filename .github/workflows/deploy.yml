name: Deploy

# Runs on main only: test the push, check the Vercel credentials, then
# publish BOTH Vercel projects. Pull requests and feature branches are
# covered by ci.yml, so the suite does not run twice per merge.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions,
# "Secrets" tab — NOT the "Variables" tab):
#   VERCEL_TOKEN  — Vercel token with access to the team below
#   VERCEL_ORG_ID — team_OuVuWFb4CX4GlaWa2YbnNyAC
#
# Project ids are not credentials, so they are inlined in each deploy job:
#   backend   prj_XoGPPcXH1nFTEUgMI5uXzUf0l4Rc
#             (agentic-rag-with-gemini-embedding-model)
#   frontend  prj_r8m4yQg5A7HKqjcrcEyZlQ4oNCiT
#             (agentic-ragsystem)
#
# Python version: .python-version picks the Vercel function runtime, while the
# project's UV_PYTHON env var picks the interpreter uv installs wheels for.
# Both are 3.14. If they drift, pure-Python imports still work but compiled
# extensions such as pydantic_core fail at cold start, e.g.
#   ModuleNotFoundError: No module named 'pydantic_core._pydantic_core'
# The "Check Python ABI" step below fails the build if that happens.
#
# Required Vercel runtime settings (Production environment) live in the
# dashboard, not here:
#   backend:  PYTHONPATH=backend, DATABASE_URL, JWT_SECRET, GOOGLE_API_KEY,
#             EMBEDDING_MODEL, QDRANT_URL, QDRANT_API_KEY, ALLOWED_ORIGINS
#   frontend: NEXT_PUBLIC_API_URL
# Schema and vectors are NOT created by this workflow: run
# `python -m app.seed` and `python -m app.ingest` against production once.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # auth.py raises at import time when JWT_SECRET is missing. The suite
      # runs without a .env and mocks every external service, so this
      # throwaway value is all it needs.
      JWT_SECRET: ci-only-not-a-real-secret-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run python -m pytest -q -m "not integration"

  # One place to fail if the secrets are missing or the token is invalid,
  # with a message that says which. Without this, both deploy jobs fail at
  # the same opaque point.
  preflight:
    name: Vercel credentials
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Check required secrets
        run: |
          missing=0
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is empty. Add it as an Actions SECRET (Settings -> Secrets and variables -> Actions -> Secrets), not as a variable."
            missing=1
          else
            echo "VERCEL_TOKEN is set (${#VERCEL_TOKEN} characters)"
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::VERCEL_ORG_ID is empty. Expected team_OuVuWFb4CX4GlaWa2YbnNyAC."
            missing=1
          else
            echo "VERCEL_ORG_ID=$VERCEL_ORG_ID"
          fi
          exit $missing

      # The CLI reads VERCEL_TOKEN from the environment, but pass it
      # explicitly so a missing/invalid value is unambiguous. Capturing the
      # output lets the failure text appear as an annotation.
      - name: Verify token
        run: |
          vercel --version
          if printf '%s' "$VERCEL_TOKEN" | grep -q '[[:space:]]'; then
            echo "::error::VERCEL_TOKEN contains whitespace or a newline; re-paste it"
            exit 1
          fi
          if ! out=$(vercel whoami --token="$VERCEL_TOKEN" 2>&1); then
            flat=$(printf '%s' "$out" | tr '\n' ' ')
            echo "::error::vercel whoami failed: $flat"
            exit 1
          fi
          echo "$out"

  deploy-backend:
    name: Deploy backend (FastAPI)
    needs: [test, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_XoGPPcXH1nFTEUgMI5uXzUf0l4Rc
      # Helps `vercel build` resolve the `app.*` imports while analysing the
      # entrypoint. This does not reach the running function — the same value
      # must also be set in the Vercel project's Production environment.
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # `vercel build` runs Vercel's Python builder on this runner, and that
      # builder shells out to `uv`. Having uv on PATH is not enough: it also
      # looks in /usr/bin and /usr/local/bin, so install it there too.
      - name: Set up uv for the Vercel builder
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version-file: .python-version
          enable-cache: true

      - name: Expose uv to the Vercel builder
        run: |
          sudo install -m 0755 "$(command -v uv)" /usr/bin/uv
          sudo install -m 0755 "$(command -v uv)" /usr/local/bin/uv
          uv --version

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      # The function runtime comes from .python-version; the wheels come from
      # UV_PYTHON. When those disagree, pydantic_core's compiled module is
      # built for the wrong ABI and the function dies at cold start with
      # "No module named 'pydantic_core._pydantic_core'". Catch it before the
      # deploy instead of in production logs.
      - name: Check Python ABI matches the function runtime
        run: |
          cfg=$(find .vercel/output/functions -name .vc-config.json -print -quit)
          if [ -z "$cfg" ]; then
            echo "::warning::No .vc-config.json in the build output; skipping ABI check"
            exit 0
          fi
          runtime=$(jq -r '.runtime' "$cfg")
          abi="cp${runtime#python}"
          abi="${abi//./}"
          echo "runtime=$runtime abi=$abi"
          so=$(find .vercel/output/functions -name "_pydantic_core.${abi}-*.so" -print -quit)
          if [ -z "$so" ]; then
            echo "::error::pydantic_core has no ${abi} build for ${runtime}. Keep UV_PYTHON, .python-version and the function runtime aligned."
            find .vercel/output/functions -name "_pydantic_core*" -print
            exit 1
          fi
          echo "OK: $so"

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Backend: $url" >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: Deploy frontend (Next.js)
    needs: [test, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_r8m4yQg5A7HKqjcrcEyZlQ4oNCiT
      NEXT_TELEMETRY_DISABLED: "1"
      # Inlined into the client bundle. Set a repository variable to point a
      # preview/other environment elsewhere; defaults to the deployed backend.
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://agentic-rag-with-gemini-embedding-m.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Frontend: $url" >> "$GITHUB_STEP_SUMMARY"
