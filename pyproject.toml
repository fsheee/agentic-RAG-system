[project]
name = "agent-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langsmith>=0.10.18",
    "psycopg2-binary>=2.9.12",
    "pyjwt>=2.14.0",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=5.7.0",
    "sqlmodel>=0.0.42",
    "torch>=2.13.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

# torch (the CPU half of the embedding stack, pulled in by
# sentence-transformers) is declared directly so the index below can be
# applied to it — uv only honours [tool.uv.sources] for direct dependencies.
# The default PyPI wheels for linux also pull in the CUDA runtime
# (nvidia-* / cuda-toolkit): several GB of libraries a CPU container never
# loads, which roughly triples the image size and the CI build time. The CPU
# index ships the same torch without those dependencies. `explicit` keeps
# every other package on PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]

markers = [
    "integration: requires live Qdrant, Neon, or an LLM API key",
]
